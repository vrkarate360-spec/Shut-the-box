name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Elegir el zip con la versión más alta
        run: |
          shopt -s nullglob
          best=""; bestv=-1; i=0
          for z in *.zip; do
            i=$((i+1)); d="_src/$i"; mkdir -p "$d"; unzip -o -q "$z" -d "$d"
            g=$(find "$d" -path '*/app/build.gradle' | head -n 1)
            [ -z "$g" ] && continue
            v=$(grep -oE 'versionCode +[0-9]+' "$g" | grep -oE '[0-9]+' | head -n 1)
            echo "$z -> versionCode ${v:-?}"
            if [ "${v:-0}" -gt "$bestv" ]; then bestv=${v:-0}; best=$(dirname "$(dirname "$g")"); fi
          done
          if [ -z "$best" ]; then echo "Todavía no hay proyecto: sube ShutTheBox.zip"; exit 0; fi
          vn=$(grep -oE 'versionName +"[^"]+"' "$best/app/build.gradle" | grep -oE '"[^"]+"' | tr -d '"')
          echo "Compilando $best (versión $vn)"
          echo "PROJ=$best" >> $GITHUB_ENV
          echo "VNAME=$vn" >> $GITHUB_ENV

      - name: Validar la lógica del juego
        if: env.PROJ != ''
        run: |
          cd "$PROJ"
          node tests/logic.test.js
          node tests/netgame.test.js

      - uses: actions/setup-java@v4
        if: env.PROJ != ''
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: env.PROJ != ''
        with:
          gradle-version: '8.9'

      - name: Compilar
        if: env.PROJ != ''
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ShutTheBox-$VNAME.apk"

      - name: Publicar APK en Releases
        if: env.PROJ != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}-${{ github.run_number }}
          name: Shut the Box ${{ env.VNAME }}
          body: APK listo para instalar.
          files: ShutTheBox-${{ env.VNAME }}.apk
          make_latest: true
