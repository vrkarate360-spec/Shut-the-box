name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o -q "$z" -d _src; done
          F=$(find _src . -name settings.gradle -not -path './.git/*' 2>/dev/null | head -n 1)
          if [ -z "$F" ]; then echo "Todavía no hay proyecto: sube ShutTheBox.zip"; exit 0; fi
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV

      - name: Validar la lógica del juego
        if: env.PROJ != ''
        run: |
          cd "$PROJ"
          node tests/logic.test.js
          node tests/netgame.test.js

      - uses: actions/setup-java@v4
        if: env.PROJ != ''
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: env.PROJ != ''
        with:
          gradle-version: '8.9'

      - name: Compilar
        if: env.PROJ != ''
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ShutTheBox.apk"

      - name: Publicar APK en Releases
        if: env.PROJ != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Shut the Box 1.1.${{ github.run_number }}
          body: APK listo para instalar. Descarga ShutTheBox.apk y ábrelo en el móvil.
          files: ShutTheBox.apk
          make_latest: true
